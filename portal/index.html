<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CTech - Employee, project, task, leave, announcement and report management application."
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>CTech - Employee Management</title>

    <!-- ================================
         CSS
         ================================ -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <!-- ================================
         MAIN APPLICATION
         app.js dynamically renders:
         - Login page
         - Dashboard
         - Employees
         - Projects
         - Tasks
         - Reports
         - Leaves
         - Announcements
         - Profile
         ================================ -->

    <div id="app"></div>


    <!-- ================================
         TOAST NOTIFICATION
         ================================ -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- ================================
         JAVASCRIPT
         ================================ -->

    <script src="./app.js"></script>

</body>

</html>
